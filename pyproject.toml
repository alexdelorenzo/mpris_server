[project]
name = "mpris_server"
version = "0.9.6"
description = "⏯️ Publish a MediaPlayer2 MPRIS device to D-Bus."
readme = "README.md"
readme-content-type = "text/markdown"
license = { text = "LGPL-3.0-only" }
authors = [
  { name = "Alex DeLorenzo", email = "projects@alexdelorenzo.dev" }
]
urls = { "Homepage" = "https://github.com/alexdelorenzo/mpris_server" }
requires-python = ">=3.12"
dependencies = [
  "emoji>=2.8.0,<3.0.0",
  "pydbus>=0.6.0,<0.7.0",
  "PyGObject>=3.34.0",
  "StrEnum>=0.4.15", # StrEnum preserves strings' case unlike enum.StrEnum
  "unidecode>=1.3.7,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mpris_server"]
